<html>

<head>
  <title>Chaitanya Bashyam</title>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: Arial;
      }

  .tablink {
    background-color: #555;
    color: white;
    float: left;
    border: none;
    outline: none;
    cursor: pointer;
    padding: 14px 16px;
    font-size: 17px;
    width: 25%;
    }

  .tablink:hover {
    background-color: #777;
    }

  .tabcontent {
    color: white;
    display: none;
    padding: 100px 20px;
    height: 100%;
    }

  #Home {background-color: red;}
  #Research {background-color: green;}
  #Personal {background-color: blue;}
    
  </style>
</head>

<body>
  
  <h1>Chaitanya Bashyam</h1>
  <p>Welcome to my website!</p>

  <button class="tablink" onclick="openPage('Home', this, 'red')" id="defaultOpen">Home</button>
  <button class="tablink" onclick="openPage('Research', this, 'green')">Research</button>
  <button class="tablink" onclick="openPage('Personal', this, 'blue')">Personal</button>

  <div id="Home" class="tabcontent">
    <h3>Home</h3>
    <p>Home is where the heart is..</p>
  </div>

  <div id="Research" class="tabcontent">
    <h3>News</h3>
    <p>Some news this fine day!</p>
  </div>

  <div id="Personal" class="tabcontent">
    <h3>Contact</h3>
    <p>Get in touch, or swing by for a cup of coffee.</p>
  </div>
  
  <script>
    function openPage(pageName, elmnt, color) {
      var i, tabcontent, tablinks;
      
      tabcontent = document.getElementsByClassName("tabcontent");
      for (i = 0; i < tabcontent.length; i++) {
        tabcontent[i].style.display = "none";
    }

      tablinks = document.getElementsByClassName("tablink");
      for (i = 0; i < tablinks.length; i++) {
        tablinks[i].style.backgroundColor = "";
    }
      
      document.getElementById(pageName).style.display = "block";

      elmnt.style.backgroundColor = color;
    }

    document.getElementById("defaultOpen").click();
  </script>
</body>

</html>
